[project]
name = "gesture-scrolling"
version = "0.1.0"
description = "Scroll and zoom system-wide with hand gestures in front of a webcam (Linux, uinput, pure Python)"
readme = "README.md"
requires-python = ">=3.10,<3.13"   # MediaPipe has no wheels for newer Pythons yet
dependencies = [
    "mediapipe>=0.10.14",
    "opencv-python-headless>=4.9",
]

[project.scripts]
gesture-scrolling = "gesture_scrolling.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gesture_scrolling"]
